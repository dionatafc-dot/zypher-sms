<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- No maximum-scale: it blocked pinch-to-zoom, which is the one way someone
     who cannot read small text can use this page at all (WCAG 1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1f" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23000%22/%3E%3Cpath%20d%3D%22M9%208.5h14.5c.6%200%201%20.7.6%201.2L12.8%2021.5H24v2H8.9c-.6%200-1-.7-.6-1.2L19.6%2010.5H9z%22%20fill%3D%22%23ff4713%22/%3E%3C/svg%3E" />
<title>SMS · Team</title>
<link rel="stylesheet" href="/styles.css" />
<style>
.choice .c-main{min-width:0}
.choice .c-sub{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:3px}
.chip.no{color:var(--danger);border-color:var(--danger-border);background:var(--danger-soft)}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:10px}
.qhead{display:flex;align-items:center;gap:14px;justify-content:space-between}
.refresh{appearance:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-soft);background:var(--card-hi);color:var(--ink);flex:0 0 auto;margin-left:auto}
.qmsg{margin-top:12px;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.45}
.sendbar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));padding:16px 20px calc(18px + env(safe-area-inset-bottom));z-index:40}
.sendbar .inner{max-width:720px;margin:0 auto}
.sel-count{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
.btn.block{width:100%}
.hidden{display:none!important}
.wrap{padding-bottom:130px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--card-hi);color:var(--ink);border:1px solid var(--line-soft);border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:8px;background:var(--card-hi);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{flex:1;appearance:none;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:15px;font-weight:600;height:40px;border-radius:9px}
/* --amber-deep, not --amber. White on #ff4713 is 3.4:1 — under the 4.5:1 a
   readability rule asks for, and this is the control that says which list you
   are looking at. #c81e00 is the same orange family (already the far end of
   --gradient-accent) and takes white to 5.8:1. */
.tab.active{background:var(--amber-strong);color:#fff}

/* ---- Rosters tab: one column per event, side by side ---------------- */
/* Wider than the 720px of the send list — the point is to see several
   events at the same time. The sideways scroll lives INSIDE .rosters,
   so the page itself never scrolls sideways. */
body.roster-mode .wrap{max-width:1180px;padding-bottom:40px}
.rosters{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px}
.ev{flex:0 0 500px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.ev-head{padding:12px 14px;background:var(--card-hi);border-bottom:1px solid var(--line)}
.ev-name{font-weight:600;font-size:16px}
.ev-when{color:var(--muted);font-size:13px;margin-top:2px}
/* Fixed px columns, not percentages: what has to fit is absolute text
   ("Glass collecting (toilets)" is the longest position), not a share of
   the card. Percentages were cutting Position and the hours. */
.sheet{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.sheet col.c-nome{width:96px}
.sheet col.c-funcao{width:152px}
.sheet col.c-status{width:94px}
.sheet col.c-hora{width:66px}
.sheet th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line)}
.sheet td{padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.sheet tr:last-child td{border-bottom:0}
/* Confirmed shifts stand out — that is the whole point of scanning the sheet */
.sheet tr.ok{background:rgba(48,209,88,.12)}
.sheet tr.ok td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.sheet .t{white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet .dash{color:var(--muted)}
/* Editable cells: look like plain text until touched, so the table still
   reads like a sheet instead of a form. */
/* 38px rows: Dionata asked for a smaller table. Still a comfortable thumb
   target, just tighter than the 44px a one-off button would get. */
.ed{width:100%;min-width:0;min-height:38px;appearance:none;font-family:inherit;font-size:13px;color:var(--ink);
    background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 5px;cursor:pointer}
select.ed{background-image:none;text-overflow:ellipsis}
input.ed{text-align:center;letter-spacing:.02em}
.ed:hover{border-color:var(--line)}
.ed:focus{outline:none;border-color:var(--amber);background:var(--bg)}
.ed option{background:#232329;color:var(--ink)}
input.ed{font-variant-numeric:tabular-nums}
.ed.saving{border-color:var(--line-soft);opacity:.6}
.ed.saved{border-color:var(--green)}
.ed.failed{border-color:var(--danger)}
.ev-empty{padding:16px 14px;color:var(--muted);font-size:14px}
/* read by a screen reader, invisible on screen — says which event each table is */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">

  <section id="screen-main">
    <div class="top">
      <div>
        <h1 id="page-title">Send SMS</h1>
        <div class="sub">Zypher Lounge · SMS</div>
      </div>
      <button class="refresh" id="btn-refresh">↻ Refresh</button>
    </div>
    <div class="tabs">
      <button class="tab" id="tab-staff">Staff</button>
      <button class="tab" id="tab-candidatos">Candidates</button>
      <button class="tab" id="tab-escalas">Rosters</button>
    </div>
    <div id="queue-body"><div class="loading">Loading…</div></div>
    <div id="roster-body" class="hidden"></div>
    <div id="settings-block">
      <div class="eyebrow" style="margin-top:26px">Settings</div>
      <div class="choices">
        <button class="choice" id="btn-webhook"><span class="c-main">🔔 Enable automatic confirmation<span class="c-sub">The team's YES/NO replies will update Notion automatically. Use once.</span></span><span class="arrow">›</span></button>
      </div>
    </div>
  </section>

</div>

<div class="sendbar hidden" id="sendbar">
  <div class="inner">
    <div class="sel-count" id="sel-count"></div>
    <button class="btn primary block" id="btn-send">Send all</button>
  </div>
</div>

<div id="toast"></div>

<div class="overlay hidden" id="pin-overlay" style="display:none">
  <div class="modal">
    <h3>Panel access</h3>
    <p>Enter the PIN to continue.</p>
    <input id="pin-input" type="password" inputmode="numeric" placeholder="PIN" style="width:100%;height:50px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg);padding:0 16px;font-size:18px;color:var(--ink);font-family:inherit;margin-bottom:14px;text-align:center;letter-spacing:.2em" />
    <div id="pin-err" class="errbar hidden">Wrong PIN.</div>
    <button class="btn primary block" id="pin-ok">Enter</button>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { pin: sessionStorage.getItem("sms_pin") || "", queue: [], events: [], staff: [], posicoes: [], statusOpcoes: [], table: localStorage.getItem("sms_table") || "staff" };
const TABLE_LABEL = { staff: "the Staff table", candidatos: "the Candidatos table" };
const isRoster = () => state.table === "escalas";
function renderTabs(){
  for(const t of ["staff","candidatos","escalas"]) $("#tab-"+t).classList.toggle("active", state.table===t);
  const roster = isRoster();
  document.body.classList.toggle("roster-mode", roster);
  $("#page-title").textContent = roster ? "Rosters" : "Send SMS";
  $("#queue-body").classList.toggle("hidden", roster);
  $("#roster-body").classList.toggle("hidden", !roster);
  $("#settings-block").classList.toggle("hidden", roster);
  if(roster) $("#sendbar").classList.add("hidden");
}
function load(){ return isRoster() ? loadRosters() : loadQueue(); }
function setTable(t){ if(state.table===t) return; state.table=t; localStorage.setItem("sms_table",t); renderTabs(); load(); }
$("#tab-staff").onclick=()=>setTable("staff");
$("#tab-candidatos").onclick=()=>setTable("candidatos");
$("#tab-escalas").onclick=()=>setTable("escalas");
renderTabs();
function headers(){ return { "Content-Type":"application/json", "x-panel-pin": state.pin }; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),3200); }

function askPin(){ const o=$("#pin-overlay"); o.style.display="flex"; o.classList.remove("hidden"); setTimeout(()=>$("#pin-input").focus(),100); }
function hidePin(){ const o=$("#pin-overlay"); o.style.display="none"; o.classList.add("hidden"); }
$("#pin-ok").onclick = () => { const v=$("#pin-input").value.trim(); if(!v)return; state.pin=v; sessionStorage.setItem("sms_pin",v); $("#pin-err").classList.add("hidden"); hidePin(); load(); };
$("#pin-input").addEventListener("keydown",(e)=>{ if(e.key==="Enter")$("#pin-ok").click(); });

async function loadQueue(){
  $("#queue-body").innerHTML='<div class="loading">Loading…</div>';
  try{
    const r=await fetch("/api/sms/queue?table="+state.table+"&t="+Date.now(),{headers:headers(),cache:"no-store"});
    if(r.status===401){ sessionStorage.removeItem("sms_pin"); state.pin=""; askPin(); return; }
    if(!r.ok) throw new Error((await r.json()).error||r.status);
    const d=await r.json(); state.queue=d.queue||[]; renderQueue();
  }catch(e){ $("#queue-body").innerHTML='<div class="errbar">Error loading: '+e.message+'</div>'; }
}
function renderQueue(){
  const q=state.queue;
  if(!q.length){ $("#queue-body").innerHTML='<div class="empty"><div class="big">Nothing to send</div>In '+TABLE_LABEL[state.table]+', write the <b>Message</b> and set <b>Status</b> to <b>Enviar</b> for each person. They show up here.</div>'; updateBar(); return; }
  let html='<div class="eyebrow">Ready to send ('+q.length+')</div>';
  for(const it of q){
    const noPhone=!it.phone;
    const chips=[it.funcao,it.evento].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join("")+(noPhone?'<span class="chip no">no phone</span>':"");
    html+=`<div class="qrow" data-id="${esc(it.escalaId)}"><div class="qhead"><div class="row-text"><div class="row-name">${esc(it.nome)||"(no name)"}</div><div class="row-meta">${chips}</div></div><button class="yes send-one" ${noPhone?"disabled":""}>Send</button></div><div class="qmsg">${esc(it.mensagem)}</div></div>`;
  }
  $("#queue-body").innerHTML=html;
  document.querySelectorAll("#queue-body .qrow").forEach(row=>{ const id=row.dataset.id; const btn=row.querySelector(".send-one"); if(btn && !btn.disabled) btn.onclick=()=>sendOne(id); });
  updateBar();
}
// ---- Rosters tab: one table per event, side by side ------------------
async function loadRosters(){
  $("#roster-body").innerHTML='<div class="loading">Loading…</div>';
  try{
    const r=await fetch("/api/sms/events?t="+Date.now(),{headers:headers(),cache:"no-store"});
    if(r.status===401){ sessionStorage.removeItem("sms_pin"); state.pin=""; askPin(); return; }
    if(!r.ok) throw new Error((await r.json()).error||r.status);
    const d=await r.json();
    state.events=d.events||[]; state.staff=d.staff||[]; state.posicoes=d.posicoes||[]; state.statusOpcoes=d.statusOpcoes||[];
    renderRosters();
  }catch(e){ $("#roster-body").innerHTML='<div class="errbar">Error loading: '+e.message+'</div>'; }
}
function evWhen(ev){
  let dia="";
  if(ev.data){ const dt=new Date(ev.data+"T12:00:00"); if(!isNaN(dt)) dia=dt.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}); }
  const horas=[ev.inicio,ev.fim].filter(Boolean).join(" – ");
  return [dia,horas].filter(Boolean).join(" · ");
}
// Um <select> editavel. opts = [{v,label}]; sel = valor marcado hoje.
function pick(campo, sel, opts, rotulo){
  let h='<select class="ed" data-f="'+campo+'" data-saved="'+esc(sel)+'" aria-label="'+esc(rotulo)+'"><option value="">—</option>';
  for(const o of opts) h+='<option value="'+esc(o.v)+'"'+(o.v===sel?" selected":"")+'>'+esc(o.label)+'</option>';
  return h+'</select>';
}
// Plain text, not type="time": the native hour widget demands 99px because it
// renders the locale's own format, which is what was cutting the hours off.
function hora(campo, v, rotulo){
  return '<input class="ed t" type="text" inputmode="numeric" maxlength="5" placeholder="--:--"'
    +' data-f="'+campo+'" data-saved="'+esc(v)+'" value="'+esc(v)+'" aria-label="'+esc(rotulo)+'">';
}
// Accepts what a person actually types. "7"->07:00 · "19"->19:00 · "1930"->19:30
// · "7:30pm"->19:30 · empty clears it. null means "I could not read this".
function normHora(s){
  let v=String(s==null?"":s).trim().toLowerCase().replace(/\s/g,"").replace(/\./g,":");
  if(!v) return "";
  const pm=/pm$/.test(v), am=/am$/.test(v);
  v=v.replace(/[ap]m$/,"");
  let h,m;
  const comDoisPontos=v.match(/^(\d{1,2}):(\d{1,2})$/), soHora=v.match(/^(\d{1,2})$/), colado=v.match(/^(\d{3,4})$/);
  if(comDoisPontos){ h=+comDoisPontos[1]; m=+comDoisPontos[2]; }
  else if(soHora){ h=+soHora[1]; m=0; }
  else if(colado){ const p=colado[1].padStart(4,"0"); h=+p.slice(0,2); m=+p.slice(2); }
  else return null;
  if(pm && h<12) h+=12;
  if(am && h===12) h=0;
  if(h>23||m>59) return null;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
// A confirmed shift turns the whole row green
function marcaLinha(tr, statusVal){ if(tr) tr.classList.toggle("ok", statusVal==="Confirmado"); }
function renderRosters(){
  const evs=state.events;
  if(!evs.length){ $("#roster-body").innerHTML='<div class="empty"><div class="big">No upcoming events</div>Add an event in the <b>Eventos</b> table in Notion, with a date from today onwards.</div>'; return; }
  const pessoas=state.staff.map(s=>({v:s.id,label:s.nome}));
  const posicoes=state.posicoes.map(p=>({v:p,label:p}));
  const status=state.statusOpcoes.map(s=>({v:s,label:s}));
  let html='<div class="eyebrow" style="margin:0 4px 12px">Upcoming events ('+evs.length+') · changes save to Notion on their own</div><div class="rosters">';
  for(const ev of evs){
    html+='<div class="ev"><div class="ev-head"><div class="ev-name">'+esc(ev.nome||"(no name)")+'</div><div class="ev-when">'+esc(evWhen(ev))+'</div></div>';
    if(!ev.roster.length){ html+='<div class="ev-empty">No one rostered yet.</div></div>'; continue; }
    html+='<table class="sheet"><caption class="sr-only">Roster for '+esc(ev.nome||"event")+'</caption><colgroup><col class="c-nome"><col class="c-funcao"><col class="c-status"><col class="c-hora"><col class="c-hora"></colgroup><thead><tr><th scope="col">Name</th><th scope="col">Position</th><th scope="col">Status</th><th scope="col">Start</th><th scope="col">End</th></tr></thead><tbody>';
    for(const p of ev.roster){
      const quem=esc(p.funcao||"this row")+" · "+esc(ev.nome||"");
      html+='<tr class="'+(p.status==="Confirmado"?"ok":"")+'" data-id="'+esc(p.escalaId)+'" data-data="'+esc(ev.data)+'">'
        +'<td>'+pick("nome",p.funcId||"",pessoas,"Name, "+quem)+'</td>'
        +'<td>'+pick("funcao",p.funcao||"",posicoes,"Position, "+quem)+'</td>'
        +'<td>'+pick("status",p.status||"",status,"Status, "+quem)+'</td>'
        +'<td class="t">'+hora("inicio",p.inicio||"","Start, "+quem)+'</td>'
        +'<td class="t">'+hora("fim",p.fim||"","End, "+quem)+'</td></tr>';
    }
    html+='</tbody></table></div>';
  }
  $("#roster-body").innerHTML=html+'</div>';
  wireEdits();
}

// ---- Saving one cell back to Notion ----------------------------------
// "change" covers picking from a menu. "blur" is the safety net for the
// phone: leaving a half-typed hour still saves instead of vanishing.
function wireEdits(){
  for(const el of document.querySelectorAll("#roster-body .ed")){
    el.addEventListener("change",()=>saveCell(el));
    el.addEventListener("blur",()=>saveCell(el));
  }
}
async function saveCell(el){
  const tr=el.closest("tr"), anterior=el.dataset.saved;
  let valor=el.value;
  // Hours: understand what was typed, or refuse without touching Notion
  if(el.dataset.f==="inicio"||el.dataset.f==="fim"){
    const n=normHora(valor);
    if(n===null){
      el.value=anterior;
      el.className=el.className.replace(/ (saving|saved)/g,"")+" failed";
      toast("✕ Hour not understood — try 19:30, 1930 or 7:30pm");
      return;
    }
    valor=n; el.value=n;
  }
  if(valor===el.dataset.saved) return;      // nothing actually changed
  if(el._busy) return; el._busy=true;
  el.className=el.className.replace(/ (saved|failed)/g,"")+" saving";
  try{
    const r=await fetch("/api/sms/events",{method:"POST",headers:headers(),
      body:JSON.stringify({escalaId:tr.dataset.id,campo:el.dataset.f,valor,data:tr.dataset.data})});
    if(r.status===401){ askPin(); throw new Error("PIN"); }
    const res=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(res.error||("HTTP "+r.status));
    el.dataset.saved=valor;
    if(el.dataset.f==="status") marcaLinha(tr,valor);   // green row on Confirmado
    el.className=el.className.replace(" saving"," saved");
    setTimeout(()=>{ el.className=el.className.replace(" saved",""); },1500);
  }catch(e){
    el.value=anterior;                       // put the old value back on screen
    if(el.dataset.f==="status") marcaLinha(tr,anterior);
    el.className=el.className.replace(" saving"," failed");
    if(e.message!=="PIN") toast("✕ Not saved: "+e.message);
  }finally{ el._busy=false; }
}
function updateBar(){
  const n=state.queue.filter(x=>x.phone).length;
  $("#sel-count").textContent=n+(n===1?" message ready":" messages ready");
  $("#btn-send").textContent=n?"Send all ("+n+")":"Nothing to send";
  $("#btn-send").disabled=n===0; $("#btn-send").style.opacity=n===0?".5":"1";
  $("#sendbar").classList.toggle("hidden", state.queue.length===0);
}
async function sendItems(items){
  const r=await fetch("/api/sms/send-queue",{method:"POST",headers:headers(),body:JSON.stringify({items})});
  if(r.status===401){ askPin(); throw new Error("PIN"); }
  const res=await r.json(); if(!r.ok) throw new Error(res.error||r.status);
  return res;
}
async function sendOne(id){
  const it=state.queue.find(x=>x.escalaId===id); if(!it) return;
  const row=document.querySelector('.qrow[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  const btn=row&&row.querySelector(".send-one");
  if(btn){ btn.textContent="…"; btn.disabled=true; }
  try{
    const res=await sendItems([{escalaId:it.escalaId,phone:it.phone,message:it.mensagem,nome:it.nome}]);
    const r0=(res.resultados||[])[0];
    if(r0&&r0.ok){ state.queue=state.queue.filter(x=>x.escalaId!==id); renderQueue(); toast("✓ Sent to "+(it.nome||"")); }
    else { toast("✕ "+((r0&&r0.error)||"failed")); if(btn){ btn.textContent="Send"; btn.disabled=false; } }
  }catch(e){ if(e.message!=="PIN") toast("✕ "+e.message); if(btn){ btn.textContent="Send"; btn.disabled=false; } }
}
$("#btn-refresh").onclick=()=>{ const b=$("#btn-refresh"); b.textContent="…"; b.disabled=true; load().finally(()=>{ b.textContent="↻ Refresh"; b.disabled=false; }); };
$("#btn-send").onclick=async()=>{
  const items=state.queue.filter(x=>x.phone).map(x=>({escalaId:x.escalaId,phone:x.phone,message:x.mensagem,nome:x.nome}));
  if(!items.length) return;
  if(!confirm("Send "+items.length+" message(s)?")) return;
  $("#btn-send").textContent="Sending…"; $("#btn-send").disabled=true;
  try{
    const res=await sendItems(items);
    const okIds=new Set((res.resultados||[]).filter(x=>x.ok).map(x=>x.escalaId));
    state.queue=state.queue.filter(x=>!okIds.has(x.escalaId));
    renderQueue();
    const fail=(res.resultados||[]).filter(x=>!x.ok);
    toast("✓ "+res.enviados+" of "+res.total+" sent"+(fail.length?" · "+fail.length+" failed":""));
  }catch(e){ if(e.message!=="PIN"){ toast("✕ "+e.message); updateBar(); } }
};
$("#btn-webhook").onclick=async()=>{
  if(!state.pin){ askPin(); return; }
  if(!confirm("Enable automatic attendance confirmation?\n\nThe team's YES/NO replies will update Notion automatically. You only need to do this once.")) return;
  const btn=$("#btn-webhook"), sub=btn.querySelector(".c-sub"), old=sub.textContent;
  sub.textContent="Enabling…"; btn.disabled=true; btn.style.opacity=".6";
  try{
    const r=await fetch("/api/sms/register-webhook?pin="+encodeURIComponent(state.pin));
    if(r.status===401){ alert("Wrong PIN. Please sign in again."); sessionStorage.removeItem("sms_pin"); state.pin=""; sub.textContent=old; btn.disabled=false; btn.style.opacity="1"; askPin(); return; }
    const res=await r.json();
    if(r.ok && res.ok){ alert("✓ Automatic confirmation enabled!\n\nWhen someone replies YES or NO, Notion updates on its own."); sub.textContent="✓ Enabled"; }
    else { alert("Didn't work: "+(res.resposta_servidor||res.error||"unknown error")); sub.textContent=old; btn.disabled=false; btn.style.opacity="1"; }
  }catch(e){ alert("Error: "+e.message); sub.textContent=old; btn.disabled=false; btn.style.opacity="1"; }
};
if(!state.pin) askPin(); else load();
</script>
</body>
